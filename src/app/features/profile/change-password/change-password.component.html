
<div class="mx-auto max-w-2xl">
  <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
    <div class="mb-5 flex items-center gap-3">
      <span class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#e7f3ff] text-[#1877f2]">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/>
          <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/>
        </svg>
      </span>

      <div>
        <h1 class="text-xl font-extrabold text-slate-900 sm:text-2xl">
          Change Password
        </h1>
        <p class="text-sm text-slate-500">
          Keep your account secure by using a strong password.
        </p>
      </div>
    </div>

    <form (ngSubmit)="changePassword()" class="space-y-4">
      <label class="block">
        <span class="mb-1.5 block text-sm font-bold text-slate-700">
          Current password
        </span>
        <input
          type="password"
          name="currentPassword"
          [ngModel]="currentPassword()"
          (ngModelChange)="currentPassword.set($event)"
          autocomplete="current-password"
          placeholder="Enter current password"
          required
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-[#1877f2] focus:bg-white"
        />
      </label>

      <label class="block">
        <span class="mb-1.5 block text-sm font-bold text-slate-700">
          New password
        </span>
        <input
          type="password"
          name="newPassword"
          [ngModel]="newPassword()"
          (ngModelChange)="newPassword.set($event)"
          autocomplete="new-password"
          placeholder="Enter new password"
          minlength="8"
          required
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-[#1877f2] focus:bg-white"
        />
        <span class="mt-1 block text-xs text-slate-500">
          At least 8 characters with uppercase, lowercase, number, and special character.
        </span>
      </label>

      <label class="block">
        <span class="mb-1.5 block text-sm font-bold text-slate-700">
          Confirm new password
        </span>
        <input
          type="password"
          name="rePassword"
          [ngModel]="rePassword()"
          (ngModelChange)="rePassword.set($event)"
          autocomplete="new-password"
          placeholder="Re-enter new password"
          required
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-[#1877f2] focus:bg-white"
        />
      </label>

      @if (errorMessage()) {
        <p role="alert" class="rounded-lg bg-red-50 p-3 text-sm text-red-600">
          {{ errorMessage() }}
        </p>
      }

      @if (successMessage()) {
        <p role="status" class="rounded-lg bg-green-50 p-3 text-sm text-green-700">
          {{ successMessage() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="inline-flex w-full items-center justify-center rounded-xl bg-[#1877f2] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-[#166fe5] cursor-pointer disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ loading() ? 'Updating...' : 'Update password' }}
      </button>
    </form>
  </section>
</div>
